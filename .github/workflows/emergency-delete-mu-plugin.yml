name: EMERGENCIA - Restaurar lcp-fix.php en mu-plugins

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/emergency-delete-mu-plugin.yml'
      - '.github/files/lcp-fix.php'
  workflow_dispatch:

jobs:
  restore-safe-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Subir lcp-fix.php via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, ssl, os

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pw   = os.environ['FTP_PASS']

          # Verificación TLS completa: son las mismas credenciales FTP con las
          # que se publica la PWA, y el deploy-frontend ya valida el
          # certificado de este host, así que no hay motivo para aceptar uno
          # cualquiera (un MITM se llevaría la contraseña).
          ctx = ssl.create_default_context()

          ftp = ftplib.FTP_TLS(context=ctx)
          ftp.connect(host, 21, timeout=30)
          ftp.auth()
          ftp.login(user, pw)
          ftp.prot_p()
          ftp.set_pasv(True)

          ftp.cwd('vapss.net/wp-content/mu-plugins')
          print("Ruta: vapss.net/wp-content/mu-plugins")

          with open('.github/files/lcp-fix.php', 'rb') as f:
              ftp.storbinary('STOR lcp-fix.php', f)

          print("lcp-fix.php subido correctamente")
          ftp.quit()
          PYEOF
