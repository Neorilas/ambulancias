name: EMERGENCIA - Restaurar lcp-fix.php en mu-plugins

# SOLO a mano (Actions → Run workflow). Antes corría también en cada push a
# master que tocara este fichero o lcp-fix.php, así que cualquier arreglo del
# propio workflow sobrescribía el plugin del WordPress sin que nadie lo pidiera.
on:
  workflow_dispatch:

jobs:
  restore-safe-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Subir lcp-fix.php via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          # Nombre del certificado del FTP de Hostalia (ver la cabecera de
          # frontend/scripts/publicador/publicar-ftp.mjs).
          FTP_TLS_NOMBRE: servicio-online.net
        run: |
          python3 - <<'PYEOF'
          import ftplib, ssl, os

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pw   = os.environ['FTP_PASS']

          # Son las mismas credenciales con las que se publica la PWA: no se
          # acepta cualquier certificado (un MITM se llevaría la contraseña).
          # FTP_HOST es una IP y el certificado es el de Hostalia, que no la
          # cubre: se valida la cadena contra las CA del sistema y el nombre a
          # mano, contra FTP_TLS_NOMBRE, ANTES de mandar la contraseña.
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_REQUIRED

          ftp = ftplib.FTP_TLS(context=ctx)
          ftp.connect(host, 21, timeout=30)
          ftp.auth()
          nombres = [v for k, v in ftp.sock.getpeercert().get('subjectAltName', ()) if k == 'DNS']
          if os.environ['FTP_TLS_NOMBRE'] not in nombres:
              raise SystemExit(f"Certificado inesperado del FTP: {nombres}")
          ftp.login(user, pw)
          ftp.prot_p()
          ftp.set_pasv(True)

          ftp.cwd('vapss.net/wp-content/mu-plugins')
          print("Ruta: vapss.net/wp-content/mu-plugins")

          with open('.github/files/lcp-fix.php', 'rb') as f:
              ftp.storbinary('STOR lcp-fix.php', f)

          print("lcp-fix.php subido correctamente")
          ftp.quit()
          PYEOF
