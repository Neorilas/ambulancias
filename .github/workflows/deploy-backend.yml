name: Deploy Backend

# develop → PRE (automático)   ·   master → PRODUCCIÓN (requiere autorización)
#
# El código YA NO lo trae el servidor con `git pull`: se empaqueta aquí y se
# sube por SSH. Así el servidor no necesita credenciales de GitHub (el pull
# llevaba fallando desde el 02/09/2026) y lo desplegado es exactamente el
# commit que disparó el workflow.

on:
  push:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  # Un deploy a la vez por rama; no se cancela el que esté en marcha.
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # ── Resuelve a qué entorno va este push ──────────────────────────────────
  destino:
    runs-on: ubuntu-latest
    outputs:
      entorno:    ${{ steps.map.outputs.entorno }}
      deploy_dir: ${{ steps.map.outputs.deploy_dir }}
      api_url:    ${{ steps.map.outputs.api_url }}
    steps:
      - id: map
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "entorno=produccion"                >> "$GITHUB_OUTPUT"
            echo "deploy_dir=/root/ambulancia"       >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.vapss.net"     >> "$GITHUB_OUTPUT"
          else
            echo "entorno=pre"                       >> "$GITHUB_OUTPUT"
            echo "deploy_dir=/root/ambulancia-pre"   >> "$GITHUB_OUTPUT"
            echo "api_url=https://api-pre.vapss.net" >> "$GITHUB_OUTPUT"
          fi

  desplegar:
    needs: destino
    runs-on: ubuntu-latest

    # Aquí está la puerta de autorización: el Environment `produccion` lleva
    # required reviewers en la configuración del repo, así que el job se queda
    # esperando aprobación. `pre` no tiene reviewers y pasa directo.
    environment:
      name: ${{ needs.destino.outputs.entorno }}
      url:  ${{ needs.destino.outputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empaquetar release
        run: tar czf release.tar.gz backend database docker-compose.yml

      - name: Subir release al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host:   ${{ secrets.HETZNER_HOST }}
          username: root
          key:    ${{ secrets.HETZNER_SSH_KEY }}
          source: release.tar.gz
          target: ${{ needs.destino.outputs.deploy_dir }}

      - name: Desplegar
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DIR: ${{ needs.destino.outputs.deploy_dir }}
          ENTORNO:    ${{ needs.destino.outputs.entorno }}
          SHA:        ${{ github.sha }}
        envs: DEPLOY_DIR,ENTORNO,SHA
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: root
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_DIR"

            if [ ! -f .env ]; then
              echo "No existe $DEPLOY_DIR/.env — ver docs/ENTORNOS.md"
              exit 1
            fi

            echo "Desplegando $SHA en $ENTORNO ($DEPLOY_DIR)"

            # Extraer a un staging y comprobar antes de pisar nada.
            rm -rf .release && mkdir .release
            tar xzf release.tar.gz -C .release
            test -f .release/docker-compose.yml
            test -f .release/backend/server.js

            rm -rf backend database docker-compose.yml
            mv .release/backend .release/database .release/docker-compose.yml .
            rm -rf .release release.tar.gz

            # GIT_COMMIT se interpola en docker-compose.yml y sale por /health,
            # que es como se comprueba qué versión está corriendo de verdad.
            export GIT_COMMIT="$SHA"

            docker compose build backend
            docker compose up -d --no-deps backend

            echo "Esperando health check..."
            for i in $(seq 1 20); do
              RESP=$(docker compose exec -T backend wget -qO- http://localhost:3001/health 2>/dev/null || true)
              case "$RESP" in
                *"$SHA"*) echo "Backend OK, sirviendo $SHA"; break ;;
                *'"status":"ok"'*) echo "  responde pero aún con otro commit ($i/20)" ;;
                *) echo "  sin respuesta ($i/20)" ;;
              esac
              if [ "$i" = "20" ]; then
                echo "El backend no llegó a servir $SHA. Últimos logs:"
                docker compose logs --tail 60 backend
                exit 1
              fi
              sleep 3
            done

            # Las migraciones corren al arrancar: si alguna falla el servidor
            # sigue en pie pero con el esquema a medias. Hay que verlo aquí.
            if docker compose logs --tail 200 backend | grep -q "Migración FALLIDA"; then
              echo "Una migración ha fallado:"
              docker compose logs --tail 200 backend | grep -A3 "Migración FALLIDA"
              exit 1
            fi

            docker image prune -f
            echo "Deploy completado"
