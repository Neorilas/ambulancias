name: Deploy Frontend

# develop → https://vapss.net/app-pre/   (automático)
# master  → https://vapss.net/app/       (automático, sin aprobación)
#
# Las dos PWA viven en el mismo hosting y se distinguen por la carpeta. La
# configuración de cada una está en frontend/.env.pre y frontend/.env.production
# (son URLs públicas, no secretos); aquí solo se elige el modo de build y el
# directorio remoto.
#
# El workflow va en dos jobs a propósito:
#   `build`     — tests + build. Corre SIEMPRE, también en develop, y es lo que
#                 da la marca del push. Aquí un rojo sí es el código.
#   `publicar`  — sube por FTP. Solo si el entorno de destino existe de verdad.
#
# Mientras PRE no esté montado (§5 de docs/ENTORNOS.md) `publicar` se salta en
# develop. Antes el job entero moría en el paso «Comprobar destino FTP», así que
# develop llevaba en rojo permanente y de paso se perdía la señal de los tests.

on:
  push:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  destino:
    runs-on: ubuntu-latest
    outputs:
      entorno:  ${{ steps.map.outputs.entorno }}
      modo:     ${{ steps.map.outputs.modo }}
      url:      ${{ steps.map.outputs.url }}
      activo:   ${{ steps.map.outputs.activo }}
    steps:
      - id: map
        env:
          # Variable de repositorio (Settings → Variables), no secret: no hay
          # nada que esconder. Vale "true" solo cuando PRE está montado de
          # verdad: carpeta app-pre/ en el hosting y secret FTP_REMOTE_DIR
          # propio del Environment `pre`.
          PRE_ACTIVO: ${{ vars.PRE_ACTIVO }}
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "entorno=produccion"                 >> "$GITHUB_OUTPUT"
            echo "modo=production"                    >> "$GITHUB_OUTPUT"
            echo "url=https://vapss.net/app/"         >> "$GITHUB_OUTPUT"
            echo "activo=true"                        >> "$GITHUB_OUTPUT"
          else
            echo "entorno=pre"                        >> "$GITHUB_OUTPUT"
            echo "modo=pre"                           >> "$GITHUB_OUTPUT"
            echo "url=https://vapss.net/app-pre/"     >> "$GITHUB_OUTPUT"
            if [ "$PRE_ACTIVO" = "true" ]; then
              echo "activo=true"                      >> "$GITHUB_OUTPUT"
            else
              echo "activo=false"                     >> "$GITHUB_OUTPUT"
            fi
          fi

  # ── Tests y build: corre siempre, en las dos ramas ────────────────────────
  build:
    needs: destino
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build (${{ needs.destino.outputs.modo }})
        working-directory: frontend
        run: npm run build -- --mode ${{ needs.destino.outputs.modo }}

      # El .htaccess lleva dentro la ruta base y sin él se rompen el fallback de
      # la SPA y el alcance del service worker. Vite lo copia de public/ y
      # gen-htaccess.js le sustituye la ruta; si algo de eso falla, mejor no
      # subir nada.
      - name: Comprobar el build
        working-directory: frontend
        run: |
          test -f dist/.htaccess || { echo "Falta dist/.htaccess"; exit 1; }
          test -f dist/sw.js     || { echo "Falta dist/sw.js"; exit 1; }
          if grep -q "__BASE_PATH__" dist/.htaccess; then
            echo "El .htaccess conserva marcadores sin sustituir"; exit 1
          fi
          echo "--- dist/.htaccess (RewriteBase) ---"
          grep -E "RewriteBase|Service-Worker-Allowed" dist/.htaccess

      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.destino.outputs.entorno }}
          path: frontend/dist/
          # SIN ESTO NO VIAJA dist/.htaccess: upload-artifact excluye los
          # dotfiles desde la v4.4, y el build llegaría al hosting sin la ruta
          # base, que es justo lo que comprueba el paso de arriba.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

  # ── Entorno sin montar: no se publica, pero se explica ────────────────────
  pre-sin-montar:
    needs: destino
    if: needs.destino.outputs.activo != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explicar por qué no se publica
        run: |
          echo "::notice title=PRE no está montado::Publicación saltada; los tests y el build sí han corrido. Ver el §5 de docs/ENTORNOS.md."
          {
            echo "### Publicación a PRE saltada"
            echo
            echo "Los tests y el build **sí** han corrido: si están en verde, el"
            echo "cambio compila. Lo que no se ha hecho es publicar, porque"
            echo "**PRE no está montado**: el Environment 'pre' no tiene su"
            echo "propio secret FTP_REMOTE_DIR y heredaría el del repo, que"
            echo "apunta a la carpeta de producción."
            echo
            echo "Los pasos están en el §5 de docs/ENTORNOS.md. Cuando estén"
            echo "hechos, poner la variable de repositorio PRE_ACTIVO a true"
            echo "en Settings → Variables."
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: [destino, build]
    if: needs.destino.outputs.activo == 'true'
    runs-on: ubuntu-latest

    # OJO: el Environment `produccion` NO tiene required reviewers (comprobado
    # 2026-09): un push a master publica en el acto, sin ninguna puerta.
    environment:
      name: ${{ needs.destino.outputs.entorno }}
      url:  ${{ needs.destino.outputs.url }}

    steps:
      - name: Recuperar el build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.destino.outputs.entorno }}
          path: dist

      # El artefacto es el único sitio por donde el .htaccess puede perderse
      # ahora (ver include-hidden-files arriba). Se comprueba otra vez porque lo
      # que se sube por FTP es esto, no lo que salió del build.
      - name: Comprobar el artefacto
        run: |
          test -f dist/.htaccess || { echo "El artefacto llegó sin .htaccess"; exit 1; }
          test -f dist/sw.js     || { echo "El artefacto llegó sin sw.js"; exit 1; }

      # Dos accidentes que este paso evita:
      #   1. server-dir vacío → FTP-Deploy-Action sube el build a la raíz del
      #      hosting y se lleva por delante la web de vapss.net.
      #   2. El entorno `pre` sin su propio FTP_REMOTE_DIR → hereda el secret
      #      del repo, que apunta a /app/, y PRE se publica ENCIMA de
      #      producción. Por eso el destino de PRE tiene que decir "pre".
      - name: Comprobar destino FTP
        env:
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          ENTORNO:    ${{ needs.destino.outputs.entorno }}
        run: |
          if [ -z "$REMOTE_DIR" ]; then
            echo "FTP_REMOTE_DIR vacío para el entorno '$ENTORNO'."
            echo "Defínelo como secret del Environment (ver docs/ENTORNOS.md)."
            exit 1
          fi
          if [ "$ENTORNO" = "pre" ] && ! echo "$REMOTE_DIR" | grep -q "pre"; then
            echo "El destino FTP de PRE no contiene 'pre': se estaría publicando"
            echo "sobre la carpeta de producción. Define FTP_REMOTE_DIR como"
            echo "secret del Environment 'pre' (ver docs/ENTORNOS.md)."
            exit 1
          fi
          if [ "$ENTORNO" = "produccion" ] && echo "$REMOTE_DIR" | grep -q "pre"; then
            echo "El destino FTP de producción apunta a una carpeta de PRE."
            exit 1
          fi

      # Script propio en vez de FTP-Deploy-Action: la acción no sabe verificar
      # el certificado cuando FTP_HOST es una IP (el certificado es el de
      # Hostalia, *.servicio-online.net) y trabajaba sin verificar. El porqué
      # completo, y qué hacer si Hostalia cambia de certificado, en la cabecera
      # de frontend/scripts/publicador/publicar-ftp.mjs.
      - name: Traer el script de publicación
        uses: actions/checkout@v4
        with:
          sparse-checkout: frontend/scripts/publicador
          sparse-checkout-cone-mode: false
          path: repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar por FTPS (certificado verificado)
        env:
          FTP_HOST:       ${{ secrets.FTP_HOST }}
          FTP_USER:       ${{ secrets.FTP_USER }}
          FTP_PASSWORD:   ${{ secrets.FTP_PASSWORD }}
          # Secret a nivel de Environment: `produccion` hereda el del repo (la
          # carpeta /app/) y `pre` define el suyo apuntando a /app-pre/.
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          # Nombre del certificado del FTP de Hostalia. No es secreto: lo
          # enseña el servidor a cualquiera que conecte.
          FTP_TLS_NOMBRE: servicio-online.net
          DIST: ${{ github.workspace }}/dist
        # `npm ci` contra el lockfile del repo: versión y hash de basic-ftp
        # fijados (este job maneja la contraseña del FTP de producción), y
        # --ignore-scripts para que ningún paquete ejecute nada al instalarse.
        working-directory: repo/frontend/scripts/publicador
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node publicar-ftp.mjs
