name: Deploy Frontend

# develop → https://vapss.net/app-pre/   (automático)
# master  → https://vapss.net/app/       (automático, sin aprobación)
#         + https://app.vapss.net/       (el mismo código, en la raíz de su
#           subdominio, mientras las dos direcciones conviven. Este NO va al
#           hosting: se sube al Hetzner por SSH, ver deploy/app-web/)
#
# Las dos PWA viven en el mismo hosting y se distinguen por la carpeta. La
# configuración de cada una está en frontend/.env.pre y frontend/.env.production
# (son URLs públicas, no secretos); aquí solo se elige el modo de build y el
# directorio remoto.
#
# El workflow va en dos jobs a propósito:
#   `build`     — tests + build. Corre SIEMPRE, también en develop, y es lo que
#                 da la marca del push. Aquí un rojo sí es el código.
#   `publicar`  — sube por FTP. Solo si el entorno de destino existe de verdad.
#
# Mientras PRE no esté montado (§5 de docs/ENTORNOS.md) `publicar` se salta en
# develop. Antes el job entero moría en el paso «Comprobar destino FTP», así que
# develop llevaba en rojo permanente y de paso se perdía la señal de los tests.

on:
  push:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - 'scripts/dependencias-obsoletas.mjs'
      - '.github/workflows/deploy-frontend.yml'
      - 'deploy/app-web/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  destino:
    runs-on: ubuntu-latest
    outputs:
      entorno:  ${{ steps.map.outputs.entorno }}
      modo:     ${{ steps.map.outputs.modo }}
      url:      ${{ steps.map.outputs.url }}
      activo:   ${{ steps.map.outputs.activo }}
    steps:
      - id: map
        env:
          # Variable de repositorio (Settings → Variables), no secret: no hay
          # nada que esconder. Vale "true" solo cuando PRE está montado de
          # verdad: carpeta app-pre/ en el hosting y secret FTP_REMOTE_DIR
          # propio del Environment `pre`.
          PRE_ACTIVO: ${{ vars.PRE_ACTIVO }}
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "entorno=produccion"                 >> "$GITHUB_OUTPUT"
            echo "modo=production"                    >> "$GITHUB_OUTPUT"
            echo "url=https://vapss.net/app/"         >> "$GITHUB_OUTPUT"
            echo "activo=true"                        >> "$GITHUB_OUTPUT"
          else
            echo "entorno=pre"                        >> "$GITHUB_OUTPUT"
            echo "modo=pre"                           >> "$GITHUB_OUTPUT"
            echo "url=https://vapss.net/app-pre/"     >> "$GITHUB_OUTPUT"
            if [ "$PRE_ACTIVO" = "true" ]; then
              echo "activo=true"                      >> "$GITHUB_OUTPUT"
            else
              echo "activo=false"                     >> "$GITHUB_OUTPUT"
            fi
          fi

  # ── Tests y build: corre siempre, en las dos ramas ────────────────────────
  build:
    needs: destino
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      # Para el deploy si una dependencia de producción tiene una
      # vulnerabilidad alta o crítica conocida (las moderadas solo se ven en
      # el log). Si bloquea: actualizar la dependencia; no quitar el paso.
      - name: Dependencias sin vulnerabilidades altas
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # `npm audit` no ve las versiones prerelease (multer 1.4.5-lts.2 pasó
      # meses con avisos públicos y daba 0). Esto mira si npm marca una
      # dependencia de producción como obsoleta: una directa para el deploy;
      # una transitiva solo deja un aviso en el resumen del run.
      - name: Dependencias directas no obsoletas
        timeout-minutes: 5
        run: node scripts/dependencias-obsoletas.mjs frontend

      - name: Build (${{ needs.destino.outputs.modo }})
        working-directory: frontend
        run: npm run build -- --mode ${{ needs.destino.outputs.modo }}

      # Producción se construye otra vez para app.vapss.net: misma API, base '/'
      # (frontend/.env.production-app). Va a dist-app/ para no pisar dist/.
      - name: Build (app.vapss.net)
        if: needs.destino.outputs.entorno == 'produccion'
        working-directory: frontend
        run: npm run build -- --mode production-app --outDir dist-app

      # El .htaccess lleva dentro la ruta base y sin él se rompen el fallback de
      # la SPA y el alcance del service worker. Vite lo copia de public/ y
      # el plugin htaccess-con-base le sustituye la ruta; si algo de eso falla,
      # mejor no subir nada.
      - name: Comprobar el build
        working-directory: frontend
        run: |
          for d in dist dist-app; do
            [ -d "$d" ] || continue
            test -f $d/.htaccess || { echo "Falta $d/.htaccess"; exit 1; }
            test -f $d/sw.js     || { echo "Falta $d/sw.js"; exit 1; }
            if grep -q "__BASE_PATH__" $d/.htaccess; then
              echo "El .htaccess de $d conserva marcadores sin sustituir"; exit 1
            fi
            # El atajo «Saltar fotos (local)» solo puede existir con `npm run dev`
            # (§3.6 del mapa). Si su texto aparece en un build, no se publica.
            if grep -rq "FOTO DE PRUEBA\|Saltar fotos" $d; then
              echo "El build $d contiene el atajo de fotos de local"; exit 1
            fi
            echo "--- $d/.htaccess (RewriteBase) ---"
            grep -E "RewriteBase|Service-Worker-Allowed" $d/.htaccess
          done
          if [ -d dist-app ] && ! grep -q "RewriteBase /$" dist-app/.htaccess; then
            echo "dist-app no está construido para la raíz del subdominio"; exit 1
          fi

      # app.vapss.net no lo sirve Apache sino un Caddy (deploy/app-web/Caddyfile),
      # con las cabeceras de seguridad copiadas a mano del .htaccess. Si alguien
      # cambia la CSP en un sitio y no en el otro, las dos direcciones dejarían
      # de cargar lo mismo: se comparan aquí, cabecera a cabecera.
      - name: Mismas cabeceras en app.vapss.net que en /app/
        if: needs.destino.outputs.entorno == 'produccion'
        run: |
          sed -nE 's/^[[:space:]]*Header always set ([^ ]+) "(.*)"$/\1: \2/p' frontend/dist-app/.htaccess | sort > htaccess.txt
          # Solo el bloque `header { … }` general del Caddyfile.
          sed -n '/^\theader {/,/^\t}/p' deploy/app-web/Caddyfile \
            | sed -nE 's/^[[:space:]]+([A-Za-z-]+) "(.*)"$/\1: \2/p' | sort > caddy.txt
          test -s htaccess.txt || { echo "No se han leído cabeceras del .htaccess"; exit 1; }
          if ! diff htaccess.txt caddy.txt; then
            echo "Las cabeceras de deploy/app-web/Caddyfile no son las del .htaccess (arriba, < .htaccess, > Caddyfile)."
            exit 1
          fi
          echo "$(wc -l < caddy.txt) cabeceras iguales"

      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.destino.outputs.entorno }}
          path: frontend/dist/
          # SIN ESTO NO VIAJA dist/.htaccess: upload-artifact excluye los
          # dotfiles desde la v4.4, y el build llegaría al hosting sin la ruta
          # base, que es justo lo que comprueba el paso de arriba.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

      - name: Guardar el build de app.vapss.net
        if: needs.destino.outputs.entorno == 'produccion'
        uses: actions/upload-artifact@v4
        with:
          name: dist-app
          path: frontend/dist-app/
          include-hidden-files: true   # el .htaccess; ver arriba
          if-no-files-found: error
          retention-days: 5

  # ── Entorno sin montar: no se publica, pero se explica ────────────────────
  pre-sin-montar:
    needs: destino
    if: needs.destino.outputs.activo != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explicar por qué no se publica
        run: |
          echo "::notice title=PRE no está montado::Publicación saltada; los tests y el build sí han corrido. Ver el §5 de docs/ENTORNOS.md."
          {
            echo "### Publicación a PRE saltada"
            echo
            echo "Los tests y el build **sí** han corrido: si están en verde, el"
            echo "cambio compila. Lo que no se ha hecho es publicar, porque"
            echo "**PRE no está montado**: el Environment 'pre' no tiene su"
            echo "propio secret FTP_REMOTE_DIR y heredaría el del repo, que"
            echo "apunta a la carpeta de producción."
            echo
            echo "Los pasos están en el §5 de docs/ENTORNOS.md. Cuando estén"
            echo "hechos, poner la variable de repositorio PRE_ACTIVO a true"
            echo "en Settings → Variables."
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: [destino, build]
    # `success()` explícito: sin `build` en verde (tests + npm audit) no se publica.
    if: success() && needs.destino.outputs.activo == 'true'
    runs-on: ubuntu-latest

    # OJO: el Environment `produccion` NO tiene required reviewers (comprobado
    # 2026-09): un push a master publica en el acto, sin ninguna puerta.
    environment:
      name: ${{ needs.destino.outputs.entorno }}
      url:  ${{ needs.destino.outputs.url }}

    steps:
      - name: Recuperar el build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.destino.outputs.entorno }}
          path: dist

      # El artefacto es el único sitio por donde el .htaccess puede perderse
      # ahora (ver include-hidden-files arriba). Se comprueba otra vez porque lo
      # que se sube por FTP es esto, no lo que salió del build.
      - name: Comprobar el artefacto
        run: |
          test -f dist/.htaccess || { echo "El artefacto llegó sin .htaccess"; exit 1; }
          test -f dist/sw.js     || { echo "El artefacto llegó sin sw.js"; exit 1; }

      # Dos accidentes que este paso evita:
      #   1. server-dir vacío → FTP-Deploy-Action sube el build a la raíz del
      #      hosting y se lleva por delante la web de vapss.net.
      #   2. El entorno `pre` sin su propio FTP_REMOTE_DIR → hereda el secret
      #      del repo, que apunta a /app/, y PRE se publica ENCIMA de
      #      producción. Por eso el destino de PRE tiene que decir "pre".
      - name: Comprobar destino FTP
        env:
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          ENTORNO:    ${{ needs.destino.outputs.entorno }}
        run: |
          if [ -z "$REMOTE_DIR" ]; then
            echo "FTP_REMOTE_DIR vacío para el entorno '$ENTORNO'."
            echo "Defínelo como secret del Environment (ver docs/ENTORNOS.md)."
            exit 1
          fi
          if [ "$ENTORNO" = "pre" ] && ! echo "$REMOTE_DIR" | grep -q "pre"; then
            echo "El destino FTP de PRE no contiene 'pre': se estaría publicando"
            echo "sobre la carpeta de producción. Define FTP_REMOTE_DIR como"
            echo "secret del Environment 'pre' (ver docs/ENTORNOS.md)."
            exit 1
          fi
          if [ "$ENTORNO" = "produccion" ] && echo "$REMOTE_DIR" | grep -q "pre"; then
            echo "El destino FTP de producción apunta a una carpeta de PRE."
            exit 1
          fi

      # Script propio en vez de FTP-Deploy-Action: la acción no sabe verificar
      # el certificado cuando FTP_HOST es una IP (el certificado es el de
      # Hostalia, *.servicio-online.net) y trabajaba sin verificar. El porqué
      # completo, y qué hacer si Hostalia cambia de certificado, en la cabecera
      # de frontend/scripts/publicador/publicar-ftp.mjs.
      - name: Traer el script de publicación
        uses: actions/checkout@v4
        with:
          # deploy/app-web: el Caddyfile y el compose de app.vapss.net.
          sparse-checkout: |
            frontend/scripts/publicador
            deploy/app-web
          sparse-checkout-cone-mode: false
          path: repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar por FTPS (certificado verificado)
        env:
          FTP_HOST:       ${{ secrets.FTP_HOST }}
          FTP_USER:       ${{ secrets.FTP_USER }}
          FTP_PASSWORD:   ${{ secrets.FTP_PASSWORD }}
          # Secret a nivel de Environment: `produccion` hereda el del repo (la
          # carpeta /app/) y `pre` define el suyo apuntando a /app-pre/.
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          # Nombre del certificado del FTP de Hostalia. No es secreto: lo
          # enseña el servidor a cualquiera que conecte.
          FTP_TLS_NOMBRE: servicio-online.net
          DIST: ${{ github.workspace }}/dist
        # `npm ci` contra el lockfile del repo: versión y hash de basic-ftp
        # fijados (este job maneja la contraseña del FTP de producción), y
        # --ignore-scripts para que ningún paquete ejecute nada al instalarse.
        working-directory: repo/frontend/scripts/publicador
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node publicar-ftp.mjs

      # ── app.vapss.net: el mismo código en la raíz de su subdominio ────────
      # Convive con vapss.net/app/ mientras los técnicos reinstalan la app.
      # Va DESPUÉS de /app/: si esto falla, la dirección de siempre ya está al
      # día y el rojo avisa de que el subdominio se ha quedado atrás.
      #
      # NO va a Hostalia: su Plesk no tiene Let's Encrypt y el SSL incluido no
      # cubre subdominios. Se sirve desde el Hetzner (/root/ambulancia-web),
      # con un contenedor caddy:2-alpine que solo sirve ficheros detrás del
      # Caddy común, que pone el certificado. Detalle en deploy/app-web/ y en
      # docs/MAPA_CODIGO.md → «Dos direcciones de la app».
      - name: Recuperar el build de app.vapss.net
        if: needs.destino.outputs.entorno == 'produccion'
        uses: actions/download-artifact@v4
        with:
          name: dist-app
          path: dist-app

      - name: Empaquetar app.vapss.net
        if: needs.destino.outputs.entorno == 'produccion'
        run: |
          test -f dist-app/index.html || { echo "El artefacto de app.vapss.net llegó sin index.html"; exit 1; }
          test -f dist-app/sw.js      || { echo "El artefacto de app.vapss.net llegó sin sw.js"; exit 1; }
          test -f repo/deploy/app-web/Caddyfile || { echo "Falta deploy/app-web/Caddyfile"; exit 1; }
          mkdir paquete
          cp -r dist-app paquete/dist-app
          cp -r repo/deploy/app-web paquete/app-web
          tar czf web.tar.gz -C paquete dist-app app-web

      - name: Subir app.vapss.net al Hetzner
        if: needs.destino.outputs.entorno == 'produccion'
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: root
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          source:   web.tar.gz
          target:   /root/ambulancia-web

      - name: Publicar app.vapss.net
        if: needs.destino.outputs.entorno == 'produccion'
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA: ${{ github.sha }}
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: root
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          envs: SHA
          # Nada de `script_stop: true` (rompe los bloques multilínea; ver
          # deploy-backend.yml). El `set -e` da el corte al primer fallo.
          script: |
            set -e
            D=/root/ambulancia-web
            cd "$D"
            mkdir -p conf sitio/releases

            rm -rf .release && mkdir .release
            tar xzf web.tar.gz -C .release
            test -f .release/dist-app/index.html
            test -f .release/dist-app/sw.js
            test -f .release/app-web/Caddyfile
            test -f .release/app-web/docker-compose.yml

            # Un Caddyfile roto tumbaría la app: se valida antes de ponerlo.
            docker run --rm -v "$D/.release/app-web:/etc/caddy:ro" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            # El build, en su carpeta, y el enlace `actual` cambiado de golpe
            # (mv -T es atómico): nunca se sirve un build a medias.
            # Relanzar el run del commit que ya se sirve: se reutiliza su carpeta
            # (es el mismo build); borrarla dejaría `actual` colgando.
            if [ ! -d "sitio/releases/$SHA" ]; then
              mv .release/dist-app "sitio/releases/$SHA"
            fi
            # tar conserva la fecha del build; la limpieza de abajo ordena por
            # fecha y no debe borrar el que se sirve (p. ej. al relanzar uno viejo).
            touch "sitio/releases/$SHA"
            ln -sfn "releases/$SHA" sitio/actual.nuevo
            mv -Tf sitio/actual.nuevo sitio/actual

            CAMBIA_CONF=0
            cmp -s .release/app-web/Caddyfile conf/Caddyfile || CAMBIA_CONF=1
            cp .release/app-web/Caddyfile conf/Caddyfile
            cp .release/app-web/docker-compose.yml docker-compose.yml
            rm -rf .release web.tar.gz

            # Es un contenedor propio (no el Caddy común): recrearlo solo corta
            # app.vapss.net un segundo. Sin cambio de config, `up -d` no hace nada
            # si ya corre: el build nuevo se ve por el enlace.
            if [ "$CAMBIA_CONF" = "1" ]; then
              docker compose up -d --force-recreate
            else
              docker compose up -d
            fi

            echo "Comprobando lo que sirve..."
            ESPERADO=$(sha256sum "sitio/releases/$SHA/index.html" | cut -d' ' -f1)
            for i in $(seq 1 10); do
              SERVIDO=$(docker exec ambulancia-web wget -qO- http://localhost:8080/ 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
              if [ "$SERVIDO" = "$ESPERADO" ]; then echo "ambulancia-web sirve $SHA"; break; fi
              if [ "$i" = "10" ]; then echo "ambulancia-web no sirve el build nuevo"; docker logs --tail 40 ambulancia-web; exit 1; fi
              sleep 2
            done

            # Se guardan el build actual y los 2 anteriores (vuelta atrás:
            # cambiar el enlace sitio/actual a otro de releases/).
            ls -1t sitio/releases | tail -n +4 | while read -r viejo; do
              rm -rf "sitio/releases/$viejo"
            done
            echo "app.vapss.net publicado"
