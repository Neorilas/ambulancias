services:

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ${STACK_NAME:-ambulancia}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # MySQL habla UTC. Tenía TZ=Europe/Madrid y NOW() escribía hora local en
    # columnas que el backend lee como UTC: las horas salían 1-2h adelantadas.
    # La hora española se calcula al pintar, no al guardar (utils/fecha.utils.js).
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --event-scheduler=ON
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Backend API Ambulancias ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-ambulancia}-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Solo para leer los logs en hora local. Las fechas de la app no dependen
      # de esto porque pasan por utils/fecha.utils.js — pero ojo: con esta TZ,
      # un `new Date('2026-09-18T20:00')` sin Z SÍ se interpretaría como hora
      # española. En el backend, fechas siempre vía fecha.utils.js.
      TZ: Europe/Madrid
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-produccion}   # produccion | pre — solo informativo (/health)
      GIT_COMMIT: ${GIT_COMMIT:-}       # lo escribe el workflow de deploy; se ve en /health
      PORT: 3001
      API_VERSION: v1

      # ── Base de datos (MySQL interno Docker) ────────────────────────────────
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10

      # ── JWT ─────────────────────────────────────────────────────────────────
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d

      # ── CORS ─────────────────────────────────────────────────────────────────
      CORS_ORIGIN: ${CORS_ORIGIN}

      # ── Avisos Web Push (VAPID) ─────────────────────────────────────────────
      # Salen del .env del servidor, que NO está en el repo (es público). Se
      # generan una sola vez por entorno con `npx web-push generate-vapid-keys`
      # y hay que guardarlas en el gestor de contraseñas: si se pierde la
      # privada, todas las suscripciones de los móviles dejan de valer y cada
      # admin tiene que volver a pulsar «Activar avisos».
      # Vacías = push apagado; el resto de la app funciona igual.
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:soporte@vapss.net}
      PUSH_RATE_LIMIT_MAX: 20
      # Minutos de margen sobre la hora prevista antes de avisar a los admins
      # de que nadie ha iniciado la asignacion. Se puede bajar desde el .env
      # del entorno para probarlo sin esperar media hora.
      AVISO_SIN_INICIAR_MINUTOS: ${AVISO_SIN_INICIAR_MINUTOS:-30}

      # ── Cartrack: mapa de flota (solo superadmin) ───────────────────────────
      # Credenciales HTTP Basic del API de la flota. Salen del .env del
      # servidor, que NO está en el repo (es público). Vacías = el mapa se
      # explica solo («sin GPS configurado») y el resto de la app funciona.
      # La URL lleva la REGIÓN: con la de otro país las mismas credenciales
      # devuelven 401, y ese es el primer sitio donde mirar.
      CARTRACK_USER:      ${CARTRACK_USER:-}
      CARTRACK_KEY:       ${CARTRACK_KEY:-}
      CARTRACK_BASE_URL:  ${CARTRACK_BASE_URL:-https://fleetapi-es.cartrack.com/rest}
      CARTRACK_CACHE_MS:  ${CARTRACK_CACHE_MS:-30000}
      CARTRACK_TIMEOUT_MS: ${CARTRACK_TIMEOUT_MS:-8000}

      # ── Uploads ─────────────────────────────────────────────────────────────
      UPLOADS_DIR: ./uploads
      MAX_FILE_SIZE_MB: 10
      ALLOWED_IMAGE_TYPES: image/jpeg,image/png,image/webp

      # ── Rate Limiting ────────────────────────────────────────────────────────
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 600   # por USUARIO autenticado
      RATE_LIMIT_MAX_ANON: 100       # por IP cuando no hay token válido
      UPLOAD_RATE_LIMIT_MAX: 60      # fotos por minuto y usuario
      LOGIN_RATE_LIMIT_MAX: 5
      LOGIN_RATE_LIMIT_WINDOW_MS: 900000
      ACCOUNT_LOCKOUT_ATTEMPTS: 5
      ACCOUNT_LOCKOUT_DURATION_MINUTES: 30

      # ── Logging ──────────────────────────────────────────────────────────────
      LOG_LEVEL: ${LOG_LEVEL:-http}
      LOG_DIR: ./logs
      BCRYPT_ROUNDS: 12

    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

    expose:
      - "3001"

    networks:
      - internal
      - proxy-net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  uploads_data:
  logs_data:

networks:
  internal:          # MySQL ↔ Backend (aislada, no expuesta)
  proxy-net:
    external: true   # Compartida con fundacion/Caddy
